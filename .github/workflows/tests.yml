name: Source regression tests

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python -m py_compile src/*.py scripts/check_ticktick_access.py scripts/check_ticktick_mcp_lifecycle.py scripts/setup_ticktick_mcp.py scripts/setup_ticktick_oauth.py
      - run: git diff --check
