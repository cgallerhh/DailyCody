name: Apply Delivery Filtering Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-delivery-filter-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-delivery-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply delivery patch
        env:
          PATCH_B64: |-
            
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import os

          patch = gzip.decompress(base64.b64decode(os.environ["PATCH_B64"])).decode("utf-8")
          with open("/tmp/delivery_filter.patch", "w", encoding="utf-8") as handle:
              handle.write(patch)
          PY
          git apply --check /tmp/delivery_filter.patch
          git apply /tmp/delivery_filter.patch
          python3 -m py_compile src/daily_cody.py
          python3 -m unittest tests/test_daily_cody_delivery.py
          git diff --check
          git rm .github/workflows/apply-delivery-filter-patch.yml
          git add README.md src/daily_cody.py tests/test_daily_cody_delivery.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden delivery completion filtering"
          git push
