name: Apply Daily Cody Source Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-daily-cody-src-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-src-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        env:
          PATCH_B64: |-
            
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import os

          patch = gzip.decompress(base64.b64decode(os.environ["PATCH_B64"])).decode("utf-8")
          with open("/tmp/daily_cody_src.patch", "w", encoding="utf-8") as handle:
              handle.write(patch)
          PY
          git apply --check /tmp/daily_cody_src.patch
          git apply /tmp/daily_cody_src.patch
          python3 -m py_compile src/daily_cody.py
          git diff --check
          git rm .github/workflows/apply-daily-cody-src-patch.yml
          git add src/daily_cody.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply Daily Cody source freshness hardening"
          git push
