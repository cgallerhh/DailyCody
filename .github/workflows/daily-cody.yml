name: Daily Cody

on:
  push:
    branches:
      - main
  schedule:
    # GitHub schedules use UTC. Run every 5 minutes during the UTC morning
    # range that covers 06:00 Europe/Berlin in both CET and CEST. The script
    # sends once in its local Berlin catch-up window and skips duplicates.
    - cron: "*/5 4-7 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send immediately, outside the 06:00 Europe/Berlin window"
        required: false
        default: "true"
      allow_duplicate:
        description: "Allow sending again even if today's briefing was already sent"
        required: false
        default: "false"

jobs:
  send-briefing:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[daily-cody-smoke]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send Daily Cody
        env:
          SENDER_EMAIL: "Cody Chief of Staff <christian.galler+cody@gmail.com>"
          RECIPIENT_EMAIL: christian.galler@gmail.com
          TIMEZONE: Europe/Berlin
          WEATHER_LABEL: "21077 Hamburg-Harburg"
          DWD_MOSMIX_STATION: "C720"
          WEATHER_LATITUDE: "53.4439"
          WEATHER_LONGITUDE: "9.9857"
          CALENDAR_NAMES: "privat,Geburtstage,A&C,MixedCup2026"
          SEND_WINDOW_HOUR: "6"
          SEND_WINDOW_END_HOUR: "9"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          OPENAI_TIMEOUT_SECONDS: ${{ vars.OPENAI_TIMEOUT_SECONDS || '120' }}
          OPENAI_MAX_ATTEMPTS: ${{ vars.OPENAI_MAX_ATTEMPTS || '2' }}
          ALLOW_TEMPLATE_FALLBACK: ${{ vars.ALLOW_TEMPLATE_FALLBACK || 'false' }}
          REQUIRE_FRESH_REMINDERS: ${{ vars.REQUIRE_FRESH_REMINDERS || 'true' }}
          FAIL_ON_STALE_REMINDERS: ${{ vars.FAIL_ON_STALE_REMINDERS || 'false' }}
          REMINDERS_MAX_AGE_HOURS: ${{ vars.REMINDERS_MAX_AGE_HOURS || '60' }}
          REFRESH_STALE_REMINDERS: ${{ vars.REFRESH_STALE_REMINDERS || 'false' }}
          FORCE_SEND: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[daily-cody-smoke]') && 'true' || github.event.inputs.force_send || 'false' }}
          ALLOW_DUPLICATE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[daily-cody-smoke]') && 'true' || github.event.inputs.allow_duplicate || 'false' }}
        run: python src/daily_cody.py
